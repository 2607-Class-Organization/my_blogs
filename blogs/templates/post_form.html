{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5">
    <div class="mx-auto max-w-4xl rounded-3xl border border-gray-200 bg-white p-6 shadow-xl sm:p-10">
    <p class="text-sm font-bold uppercase tracking-[0.18em] text-gold-700">DevBlogs</p>
    <h1 class="mt-2 font-display text-3xl font-bold text-charcoal">{{ page_title|default:"Create Post" }}</h1>
    
    <form method="post" enctype="multipart/form-data" class="mt-8 space-y-6">
        {% csrf_token %}
        {% crispy form %}
    </form>
    </div>
</div>
{% endblock %}
